<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFF6EA">
<title>Word Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF6EA; --ink:#3B3355; --soft:#7A7194; --line:#ECE5F3;
  --coral:#FF8B7B; --sun:#FFC95E; --mint:#79D2B2; --sky:#8CC4FF; --lilac:#B7A3F3; --pink:#FFB3C7;
  --lift:0 6px 0 rgba(59,51,85,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Outfit',system-ui,sans-serif;letter-spacing:-.005em;min-height:100dvh;overflow-x:hidden;-webkit-user-select:none;user-select:none}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(520px 380px at 0 0,#FFE3D6,transparent 70%),
  radial-gradient(520px 400px at 100% 0,#E5E0FF,transparent 70%),
  radial-gradient(700px 420px at 50% 110%,#D9F3E8,transparent 70%)}
#app{max-width:900px;margin:0 auto;padding:18px 16px 140px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.word{font-family:'Lexend',sans-serif;font-weight:500;letter-spacing:-.01em}
h1,h2,h3{font-weight:600;margin:0}

/* shared bits */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:clamp(22px,4vw,30px)}
.brand .bee{width:48px;height:44px}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;padding:7px 14px;border-radius:99px;font-weight:600;font-size:17px;box-shadow:0 3px 0 rgba(59,51,85,.08)}
.pill svg{width:20px;height:20px}
.pill.bump{animation:bump .5s}
.ibtn{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 3px 0 rgba(59,51,85,.08);flex:none}
.ibtn svg{width:20px;height:20px}
.ibtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(59,51,85,.08)}
.card{background:rgba(255,255,255,.8);border-radius:28px;padding:18px;box-shadow:0 12px 32px -16px rgba(59,51,85,.28)}
.sec{font-size:20px;margin:24px 4px 12px}
.press{transition:transform .12s,box-shadow .12s}
.press:active{transform:translateY(4px)}

/* home */
.garden-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 12px}
.garden-head h2{font-size:20px}
.garden-head p{margin:0;color:var(--soft);font-size:15px}
.beds{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:4px 6px;margin-top:10px}
.plant{display:flex;flex-direction:column;align-items:center;padding:4px 0 6px;border-radius:20px}
.plant svg{width:76px;height:94px;transform-origin:50% 92%}
.plant .word{font-size:21px;background:#fff;padding:2px 12px;border-radius:12px;margin-top:-4px;box-shadow:0 2px 0 rgba(59,51,85,.06)}
.plant.sway svg{animation:sway .9s ease-in-out}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.game-card{position:relative;text-align:left;padding:18px 18px 52px;border-radius:24px;background:var(--c);box-shadow:0 6px 0 var(--d);min-height:132px;overflow:hidden}
.game-card:active{box-shadow:0 2px 0 var(--d)}
.game-card h3{font-size:21px;margin-bottom:3px}
.game-card p{margin:0;font-size:15px;color:color-mix(in srgb,var(--ink) 70%,transparent)}
.game-card .gicon{position:absolute;right:12px;bottom:10px;width:52px;height:52px}
.game-card.wide{grid-column:1/-1;min-height:0;padding-bottom:18px;background:linear-gradient(100deg,#FFD8CF,#FFE7AE 25%,#CFF1E3 50%,#CFE5FF 75%,#E4DBFF)}
.game-card.wide .gicon{top:50%;bottom:auto;transform:translateY(-50%)}
.c-sky{--c:#CFE5FF;--d:#A9CCF5}.c-lilac{--c:#E4DBFF;--d:#C6B8F2}.c-sun{--c:#FFE7AE;--d:#F2CF7E}
.c-mint{--c:#CFF1E3;--d:#A3DDC6}.c-pink{--c:#FFDCE6;--d:#F4B6C8}.c-coral{--c:#FFD8CF;--d:#F4B2A4}.c-mix{--d:#E2CDB4}

/* game shell */
.game-top{display:flex;align-items:center;gap:12px}
.dots{flex:1;display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:rgba(59,51,85,.13);transition:all .3s}
.dots i.on{background:var(--coral)}
.dots i.cur{background:var(--sun);transform:scale(1.35)}
.game-title{text-align:center;color:var(--soft);font-size:18px;font-weight:600;margin:14px 0 16px}
.stage{display:flex;flex-direction:column;align-items:center;gap:26px;animation:fadein .35s}
.prompt{display:flex;align-items:center;gap:14px;background:#fff;padding:8px 22px 8px 8px;border-radius:99px;box-shadow:0 4px 0 rgba(59,51,85,.07);font-size:19px;max-width:100%}
.prompt .chip{font-size:26px;background:var(--bg);padding:0 12px;border-radius:12px;margin-left:4px}
.hear{width:56px;height:56px;border-radius:50%;background:var(--sky);display:grid;place-items:center;box-shadow:0 4px 0 #6FA9E8;flex:none}
.hear svg{width:28px;height:28px}
.hear:active{transform:translateY(3px);box-shadow:0 1px 0 #6FA9E8}
.hear.pulse{animation:ring 1.8s infinite}

.buddy{position:fixed;left:max(12px,calc(50% - 440px));bottom:max(12px,env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:4px;z-index:5;pointer-events:none}
.buddy .bee{width:96px;height:88px;animation:hover 2.6s ease-in-out infinite}
.buddy.happy .bee{animation:hop .7s}
.buddy.oops .bee{animation:wobble .6s}
.say{background:#fff;padding:10px 16px;border-radius:20px 20px 20px 4px;font-weight:500;font-size:18px;margin-bottom:54px;box-shadow:0 4px 0 rgba(59,51,85,.07);max-width:260px}
.say:empty{display:none}
.say.new{animation:popin .3s}
.bee .wings{transform-origin:60px 46px;animation:flap .18s ease-in-out infinite alternate}

/* hear & find */
.choices{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;width:100%;max-width:660px}
.choice{flex:1 1 150px;max-width:200px;background:#fff;border-radius:26px;padding:30px 8px;font-size:clamp(36px,8vw,56px);box-shadow:var(--lift)}
.choice:active{box-shadow:0 2px 0 rgba(59,51,85,.12)}
.choice.right{background:#D6F5E8;box-shadow:0 6px 0 #8FD6B8;transform:translateY(-6px)}
.choice.dim{opacity:.35;pointer-events:none}

/* bubbles */
.field{position:relative;width:100%;height:min(58vh,520px);border-radius:30px;overflow:hidden;background:linear-gradient(#EAF4FF,#F3EEFF)}
.bub{--b:clamp(78px,17vw,104px);position:absolute;top:100%;width:var(--b);height:var(--b);margin-left:calc(var(--b) / -2);border-radius:50%;display:grid;place-items:center;font-size:calc(var(--b) * .29);
  background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.95) 0 9%,transparent 10%),radial-gradient(circle,hsla(var(--h),90%,90%,.55),hsla(var(--h),85%,78%,.9));
  border:2px solid rgba(255,255,255,.95);box-shadow:inset -6px -8px 18px hsla(var(--h),70%,60%,.35);
  animation-name:rise,drift;animation-timing-function:linear,ease-in-out;animation-iteration-count:infinite,infinite;animation-direction:normal,alternate;
  transition:opacity .25s,scale .25s}
.bub.popped{opacity:0;scale:1.6;pointer-events:none}
.bub.nope{animation-play-state:paused,paused;filter:saturate(.4)}

/* builder */
.slots{display:flex;gap:10px;justify-content:center}
.slot{--s:min(78px,calc((100vw - 52px - (var(--n) - 1) * 10px) / var(--n)));width:var(--s);height:calc(var(--s) * 1.2);border-radius:20px;background:#fff;border:3px dashed #DCD4EC;display:grid;place-items:center;font-size:calc(var(--s) * .66);color:#E9E3F3}
.slot.filled{border:3px solid var(--sun);background:#FFF4D6;color:var(--ink);animation:popin .25s}
.slots.done .slot{border-color:var(--mint);background:#D6F5E8}
.tiles{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:520px}
.tile{width:74px;height:74px;border-radius:20px;background:var(--sun);font-size:42px;box-shadow:0 6px 0 #E0A93E}
.tile:active{box-shadow:0 2px 0 #E0A93E}
.tile.used{visibility:hidden}

/* missing letter */
.mword{display:flex;align-items:flex-end;gap:6px;font-size:clamp(70px,17vw,120px);line-height:1.2;background:#fff;padding:10px 40px 18px;border-radius:34px;box-shadow:0 8px 0 rgba(59,51,85,.08)}
.gap{display:inline-block;min-width:.62em;height:1.1em;border-bottom:8px solid var(--mint);text-align:center;color:transparent}
.gap.filled{color:var(--ink);border-color:transparent;animation:popin .3s}
.letters{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.letter{width:96px;height:96px;border-radius:26px;background:var(--mint);font-size:54px;box-shadow:0 6px 0 #4FB893}
.letter:active{box-shadow:0 2px 0 #4FB893}
.letter.dim{opacity:.35;pointer-events:none}

/* memory */
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;max-width:540px}
.mcard{aspect-ratio:4/5;perspective:900px}
.mcard .inner{position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.3,.8,.3,1.2);transform-style:preserve-3d}
.mcard.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;-webkit-backface-visibility:hidden;backface-visibility:hidden;display:grid;place-items:center}
.face.back{background:var(--pink);box-shadow:0 6px 0 #F09AB2;background-image:radial-gradient(rgba(255,255,255,.45) 2px,transparent 2.5px);background-size:16px 16px}
.face.back svg{width:44%;height:44%}
.face.front{background:#fff;transform:rotateY(180deg);font-size:clamp(28px,7vw,46px);box-shadow:var(--lift)}
.mcard.matched .face.front{background:#D6F5E8;box-shadow:0 6px 0 #8FD6B8}

/* read to me */
.readcard{background:#fff;border-radius:40px;padding:20px 54px 30px;font-size:clamp(84px,22vw,160px);line-height:1.2;box-shadow:0 10px 0 rgba(59,51,85,.08);display:flex}
.readcard span{transition:color .2s,transform .2s;display:inline-block}
.readcard span.lit{color:var(--coral);transform:translateY(-8px)}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.soft-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:99px;background:#fff;font-weight:600;font-size:18px;box-shadow:0 4px 0 rgba(59,51,85,.1)}
.soft-btn svg{width:22px;height:22px}
.go-btn{padding:18px 40px;border-radius:99px;background:var(--mint);font-size:24px;font-weight:600;box-shadow:0 6px 0 #4FB893}
.go-btn:active{box-shadow:0 2px 0 #4FB893}

/* overlays */
.overlay{position:fixed;inset:0;z-index:30;background:rgba(59,51,85,.35);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;animation:fadein .25s}
.sheet{background:#FFFBF5;border-radius:32px;padding:26px 24px;width:100%;max-width:440px;text-align:center;animation:popin .35s}
.sheet h2{font-size:34px;margin:2px 0}
.sheet p{color:var(--soft);margin:4px 0 0;font-size:18px}
.sheet .bee{width:120px;height:110px}
.starrow{margin:12px 0;display:flex;justify-content:center;flex-wrap:wrap;gap:2px}
.starrow svg{width:32px;height:32px;animation:popin .4s backwards}
.btns{display:flex;gap:12px;justify-content:center;margin-top:18px}
.btn{padding:13px 24px;border-radius:99px;font-weight:600;font-size:18px;background:#fff;box-shadow:0 4px 0 rgba(59,51,85,.1)}
.btn.primary{background:var(--mint);box-shadow:0 4px 0 #4FB893}
.btn.coral{background:var(--coral);color:#fff;box-shadow:0 5px 0 #E06A59}
.grew{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:6px}
.grew .plant svg{width:60px;height:76px}
.grew .plant .word{font-size:18px}
.gate-q{font-size:44px;font-weight:600;margin:10px 0 16px}
.gate-opts{display:flex;gap:12px;justify-content:center}
.gate-opts button{width:72px;height:72px;border-radius:22px;background:var(--lilac);color:#fff;font-size:30px;font-weight:600;box-shadow:0 5px 0 #9580D9}

/* parent */
.form label{display:block;font-weight:600;font-size:16px;margin-bottom:8px}
.form .hint{color:var(--soft);font-size:14px;margin:8px 2px 0}
.chips{background:#fff;border:2px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;min-height:64px;cursor:text}
.chips:focus-within{border-color:var(--lilac)}
.chipw{display:inline-flex;align-items:center;gap:4px;background:#FFF1E2;padding:4px 6px 4px 12px;border-radius:12px;font-size:20px}
.chipw button{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--soft)}
.chipw button:hover{background:rgba(59,51,85,.08)}
.chipw button svg{width:12px;height:12px}
.chips input{flex:1;min-width:120px;border:0;outline:0;font:inherit;font-size:18px;color:var(--ink);background:transparent;padding:4px;-webkit-user-select:text;user-select:text}
.chips input::placeholder{color:#B9B0CC}
.prog{display:grid;grid-template-columns:72px 1fr 40px;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.prog:last-child{border:0}
.prog .word{font-size:19px}
.bar{height:10px;border-radius:9px;background:var(--line);overflow:hidden}
.bar b{display:block;height:100%;background:var(--mint);border-radius:9px}
.prog span:last-child{color:var(--soft);text-align:right}
.empty{color:var(--soft);font-size:15px;padding:8px 0}
.link-btn{color:var(--soft);font-size:15px;text-decoration:underline;text-underline-offset:3px;margin:14px auto 0;display:block}

/* fx */
.confetti{position:fixed;width:10px;height:14px;border-radius:3px;pointer-events:none;z-index:50;animation:conf .9s cubic-bezier(.2,.7,.4,1) forwards}
.rain{position:fixed;top:-20px;width:10px;height:14px;border-radius:3px;pointer-events:none;z-index:40;animation:fall linear forwards}
.shake{animation:shake .45s}

@keyframes conf{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--rot));opacity:0}}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes popin{from{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}to{transform:scale(1);opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes bump{50%{transform:scale(1.18)}}
@keyframes sway{25%{transform:rotate(-7deg)}75%{transform:rotate(6deg)}}
@keyframes hover{50%{transform:translateY(-8px)}}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-34px) rotate(-10deg)}70%{transform:translateY(0) scale(1.08,.92)}100%{transform:none}}
@keyframes wobble{20%{transform:rotate(-12deg)}45%{transform:rotate(9deg)}70%{transform:rotate(-5deg)}100%{transform:none}}
@keyframes flap{to{transform:scaleY(.82)}}
@keyframes ring{0%{box-shadow:0 4px 0 #6FA9E8,0 0 0 0 rgba(140,196,255,.6)}70%{box-shadow:0 4px 0 #6FA9E8,0 0 0 14px rgba(140,196,255,0)}100%{box-shadow:0 4px 0 #6FA9E8,0 0 0 0 rgba(140,196,255,0)}}
@keyframes rise{from{top:100%}to{top:-30%}}
@keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}.bub{animation-duration:14s,3s!important}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------- data + storage ---------- */
const DEFAULT_WORDS = ['the','and','a','go','has'];
const FILLER = ['is','it','in','to','see','can','we','me','my','up','look','like','you','for','at','on','he','she','was','are','big','run','come','here','play','not','one','red','blue','said','down'];
const PRAISE = ['You got it!','Great job!','Super reading!','Wow!','Yes!','Amazing!','Nice one!'];
const OOPS = ['Hmm, try again!','Almost! Try again.','Oops! One more try.','Keep going!'];
const FLOWER = ['#FF8B7B','#B7A3F3','#8CC4FF','#FFB3C7','#FFC95E','#79D2B2'];

const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const state = {
  words: store.get('wg-words', DEFAULT_WORDS),
  scores: store.get('wg-scores', {}),
  stars: store.get('wg-stars', 0),
};
if (!Array.isArray(state.words) || !state.words.length) state.words = DEFAULT_WORDS.slice();
function save(){ store.set('wg-words', state.words); store.set('wg-scores', state.scores); store.set('wg-stars', state.stars); }

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const app = $('#app');
const lc = w => w.toLowerCase();
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const scoreOf = w => state.scores[lc(w)] || 0;
const stageOf = s => s >= 5 ? 3 : s >= 3 ? 2 : s >= 1 ? 1 : 0;
const colorOf = w => FLOWER[Math.max(0, state.words.findIndex(x => lc(x) === lc(w))) % FLOWER.length];

function distractors(word, n){
  const own = shuffle(state.words.filter(w => lc(w) !== lc(word)));
  const fill = shuffle(FILLER.filter(f => lc(f) !== lc(word) && !state.words.some(w => lc(w) === f)));
  return [...own, ...fill].slice(0, n);
}
function randomLetters(n, exclude){
  const ex = exclude.map(lc);
  return shuffle('abcdefghiklmnoprstuwy'.split('').filter(c => !ex.includes(c))).slice(0, n);
}

/* ---------- voice + sound ---------- */
let voice = null;
function pickVoice(){
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  const prefer = ['Samantha','Google US English','Ava','Allison','Karen','Moira','Serena'];
  voice = prefer.map(n => vs.find(v => v.name.includes(n) && v.lang.startsWith('en'))).find(Boolean)
       || vs.find(v => v.lang === 'en-US') || vs.find(v => v.lang.startsWith('en')) || null;
}
if ('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

function utter(text, opts = {}){
  const u = new SpeechSynthesisUtterance(text);
  if (voice) u.voice = voice;
  u.lang = 'en-US'; u.rate = opts.rate || 0.82; u.pitch = 1.1;
  if (opts.onstart) u.onstart = opts.onstart;
  if (opts.onend) u.onend = opts.onend;
  return u;
}
// "a" on its own is read as the letter name by most voices; nudge it to the word sound.
const sayable = w => lc(w) === 'a' ? 'uh' : w;
function speak(text, opts){
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  setTimeout(() => speechSynthesis.speak(utter(text, opts)), 40);
}
function speakSeq(items){
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  setTimeout(() => items.forEach(it => speechSynthesis.speak(utter(it.text, it))), 40);
}

let ac;
function tone(freqs, dur = .14, type = 'sine', gap = .09, vol = .16){
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const t0 = ac.currentTime;
    freqs.forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain(), t = t0 + i * gap;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(ac.destination);
      o.start(t); o.stop(t + dur + .05);
    });
  } catch {}
}
const sfx = {
  yes: () => tone([660, 880, 1175], .16),
  no: () => tone([330, 262], .2, 'triangle', .12, .12),
  pop: () => tone([990], .08, 'triangle', 0, .14),
  tap: () => tone([520], .06, 'sine', 0, .08),
  win: () => tone([523, 659, 784, 1047, 1319], .22, 'sine', .11),
};

/* ---------- art ---------- */
let svgId = 0;
function beeSVG(){
  const id = 'bc' + (++svgId);

function plantSVG(stage, color){
  const soil = `<ellipse cx="40" cy="93" rx="30" ry="7" fill="#C9A27E"/><ellipse cx="40" cy="91" rx="25" ry="5" fill="#B58863"/>`;
  const stem = top => `<path d="M40 90V${top}" stroke="#5DBB8A" stroke-width="3.5" stroke-linecap="round"/>`;
  const leafL = y => `<path d="M40 ${y}C30 ${y-1} 26 ${y-10} 28 ${y-13}C37 ${y-13} 41 ${y-6} 40 ${y}Z" fill="#79D2B2"/>`;
  const leafR = y => `<path d="M40 ${y}C50 ${y-1} 54 ${y-10} 52 ${y-13}C43 ${y-13} 39 ${y-6} 40 ${y}Z" fill="#79D2B2"/>`;
  let body = '';
  if (stage === 0) body = `<ellipse cx="40" cy="86" rx="6.5" ry="4.8" fill="#8A6A4F"/><path d="M37 84.5q3-2.5 6 0" stroke="#A88566" stroke-width="1.5" fill="none" stroke-linecap="round"/>`;
  if (stage === 1) body = stem(72) + leafL(80) + leafR(80);
  if (stage === 2) body = stem(50) + leafL(78) + leafR(66) + `<ellipse cx="40" cy="42" rx="8" ry="11" fill="${color}"/><path d="M32 46Q40 56 48 46Z" fill="#79D2B2"/>`;
  if (stage === 3) body = stem(44) + leafL(78) + leafR(64)
    + [0,60,120,180,240,300].map(a => `<ellipse cx="40" cy="22" rx="7.5" ry="11" fill="${color}" transform="rotate(${a} 40 34)"/>`).join('')
    + `<circle cx="40" cy="34" r="8" fill="#FFE08A"/><circle cx="37" cy="33" r="1.4" fill="#3B3355"/><circle cx="43" cy="33" r="1.4" fill="#3B3355"/><path d="M37.5 36.5q2.5 2 5 0" stroke="#3B3355" stroke-width="1.2" fill="none" stroke-linecap="round"/>`;
  return `<svg viewBox="0 0 80 100" aria-hidden="true">${soil}${body}</svg>`;
}
function plantHTML(w, tag = 'button'){
  return `<${tag} class="plant" data-word="${esc(w)}">${plantSVG(stageOf(scoreOf(w)), colorOf(w))}<span class="word">${esc(w)}</span></${tag}>`;
}

};

/* ---------- fx ---------- */
const FX_COLORS = ['#FF8B7B','#FFC95E','#79D2B2','#8CC4FF','#B7A3F3','#FFB3C7'];
function burst(el, n = 16){
  if (!el) return;
  const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  for (let i = 0; i < n; i++){
    const p = document.createElement('i');
    p.className = 'confetti';
    const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 100;
    p.style.cssText = `left:${cx}px;top:${cy}px;background:${pick(FX_COLORS)};--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d - 40}px;--rot:${Math.random() * 540 - 270}deg`;
    document.body.append(p);
    setTimeout(() => p.remove(), 950);
  }
}
function rain(n = 70){
  for (let i = 0; i < n; i++){
    const p = document.createElement('i');
    p.className = 'rain';
    const dur = 2 + Math.random() * 2;
    p.style.cssText = `left:${Math.random() * 100}vw;background:${pick(FX_COLORS)};animation-duration:${dur}s;animation-delay:${Math.random() * .8}s;--dx:${Math.random() * 120 - 60}px;--rot:${Math.random() * 900}deg`;
    document.body.append(p);
    setTimeout(() => p.remove(), (dur + 1) * 1000);
  }
}
function replay(el, cls){ if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

/* ---------- game engine ---------- */
let session = null;
const MIX_POOL = ['listen','bubbles','build','missing','read','listen','build','memory'];

function startGame(id){
  session = { id, mixed: id === 'mix', round: 0, total: id === 'mix' ? 8 : (GAMES[id].rounds || 6), stars: 0, grown: new Set(), last: null, missed: new Set(), locked: false, timers: [] };
  app.innerHTML = `
    <div class="game-top">
      <button class="ibtn" id="quit" aria-label="Back to garden">${CLOSE}</button>
      <div class="dots">${Array.from({ length: session.total }, () => '<i></i>').join('')}</div>
      <span class="pill" id="starPill">${STAR}<span>${state.stars}</span></span>
    </div>
    <h2 class="game-title" id="gameTitle"></h2>
    <div class="stage" id="stage"></div>
    <div class="buddy" id="buddy">${beeSVG()}<div class="say" id="say"></div></div>`;
  $('#quit').onclick = renderHome;
  nextRound();
}
function later(fn, ms){ const s = session; const t = setTimeout(() => { if (session === s) fn(); }, ms); s.timers.push(t); }

function pickWord(){
  const ws = state.words;
  if (ws.length === 1) return ws[0];
  const pool = ws.filter(w => w !== session.last);
  const weights = pool.map(w => 6 - scoreOf(w));
  let r = Math.random() * weights.reduce((a, b) => a + b, 0);
  for (let i = 0; i < pool.length; i++){ r -= weights[i]; if (r <= 0) return (session.last = pool[i]); }
  return (session.last = pool[pool.length - 1]);
}

function nextRound(){
  if (!session) return;
  if (session.round >= session.total) return finish();
  session.round++;
  session.missed = new Set();
  session.locked = false;
  const gid = session.mixed ? pick(MIX_POOL) : session.id;
  const game = GAMES[gid];
  $$('.dots i').forEach((d, i) => { d.className = i < session.round - 1 ? 'on' : i === session.round - 1 ? 'cur' : ''; });
  $('#gameTitle').textContent = game.title;
  const stage = $('#stage');
  stage.innerHTML = '';
  replay(stage, 'stage');
  const word = pickWord();
  say(game.hint);
  game.round(stage, word);
}

function say(text){ const el = $('#say'); if (!el) return; el.innerHTML = text; replay(el, 'new'); }
function buddy(cls){ replay($('#buddy'), cls); }
function addStar(){
  state.stars++; session.stars++; save();
  const pill = $('#starPill');
  if (pill){ $('span', pill).textContent = state.stars; replay(pill, 'bump'); }
}
function bump(word, d){
  const k = lc(word), before = state.scores[k] || 0, after = Math.max(0, Math.min(5, before + d));
  state.scores[k] = after;
  if (stageOf(after) > stageOf(before)) session.grown.add(word);
  save();
}

// Right answer. Score only grows if this word wasn't missed in this round.
function hit(word, el, { silent = false } = {}){
  if (!session.missed.has(word)) bump(word, 1);
  addStar(); sfx.yes(); burst(el); buddy('happy');
  if (!silent){
    const p = pick(PRAISE);
    say(`${p} That's <b class="word">${esc(word)}</b>.`);
    speak(`${sayable(word)}! ${p}`);
  }
}
// Wrong answer. Gentle; only costs one point per word per round.
function miss(word, el){
  if (!session.missed.has(word)){ session.missed.add(word); bump(word, -1); }
  sfx.no(); replay(el, 'shake'); buddy('oops'); say(pick(OOPS));
}
function done(delay = 1500){
  if (session.locked) return;
  session.locked = true;
  later(nextRound, delay);
}
function hearBtn(word, extra = ''){ return `<button class="hear pulse" data-say="${esc(word)}" aria-label="Hear the word">${SPEAKER}</button>${extra}`; }
function wireHear(stage, word){ const b = $('.hear', stage); if (b) b.onclick = () => { b.classList.remove('pulse'); speak(sayable(word)); }; }

/* ---------- games ---------- */
const GAMES = {
  listen: {
    title: 'Hear & Find', hint: 'Listen, then tap the word!',
    round(stage, word){
      const opts = shuffle([word, ...distractors(word, 2)]);
      stage.innerHTML = `
        <div class="prompt">${hearBtn(word)}<span>Find the word you hear</span></div>
        <div class="choices">${opts.map(w => `<button class="choice word" data-w="${esc(w)}">${esc(w)}</button>`).join('')}</div>`;
      wireHear(stage, word);
      $$('.choice', stage).forEach(b => b.onclick = () => {
        if (session.locked) return;
        if (b.dataset.w === word){ b.classList.add('right'); hit(word, b); done(); }
        else { b.classList.add('dim'); miss(word, b); later(() => speak(sayable(word)), 900); }
      });
      later(() => speak(sayable(word)), 450);
    },
  },

  bubbles: {
    title: 'Bubble Pop', hint: 'Pop all the matching bubbles!',
    round(stage, word){
      const others = distractors(word, 4);
      const items = shuffle([word, word, word, ...others]);
      stage.innerHTML = `
        <div class="prompt">${hearBtn(word)}<span>Pop every</span><span class="chip word">${esc(word)}</span></div>
        <div class="field" id="field"></div>`;
      wireHear(stage, word);
      const field = $('#field', stage);
      let left = 3;
      items.forEach((w, i) => {
        const b = document.createElement('button');
        b.className = 'bub word';
        b.textContent = w;
        // Spread neighbours apart in time so bubbles in adjacent lanes don't collide.
        const lane = (((i * 3) % items.length) + .5) / items.length;
        const dur = 8 + Math.random() * 4, drift = 2.4 + Math.random() * 1.6;
        b.style.left = `${12 + lane * 76}%`;
        b.style.setProperty('--h', [12, 45, 160, 210, 265, 330][i % 6]);
        b.style.animationDuration = `${dur}s, ${drift}s`;
        b.style.animationDelay = `${-(i / items.length) * dur}s, ${-Math.random() * drift}s`;
        b.onclick = () => {
          if (session.locked || b.classList.contains('popped')) return;
          if (w === word){
            b.classList.add('popped'); sfx.pop(); burst(b, 10); left--;
            if (left === 0){ hit(word, b); done(1600); }
            else { speak(sayable(word)); say(`${left} more!`); }
          } else {
            b.classList.add('nope'); setTimeout(() => b.classList.remove('nope'), 600);
            miss(word, b);
          }
        };
        field.append(b);
      });
      later(() => speak(sayable(word)), 450);
    },
  },

  build: {
    title: 'Word Builder', hint: 'Tap the letters in order!',
    round(stage, word){
      const letters = word.split('');
      const tiles = shuffle([...letters, ...randomLetters(2, letters)]);
      stage.innerHTML = `
        <div class="prompt">${hearBtn(word)}<span>Build</span><span class="chip word">${esc(word)}</span></div>
        <div class="slots word" style="--n:${letters.length}">${letters.map(c => `<div class="slot">${esc(c)}</div>`).join('')}</div>
        <div class="tiles">${tiles.map(c => `<button class="tile word" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>`;
      wireHear(stage, word);
      const slots = $$('.slot', stage);
      let pos = 0;
      $$('.tile', stage).forEach(t => t.onclick = () => {
        if (session.locked || pos === letters.length) return;
        if (lc(t.dataset.c) === lc(letters[pos])){
          slots[pos].classList.add('filled'); t.classList.add('used'); sfx.tap(); speak(lc(t.dataset.c), { rate: .9 });
          pos++;
          if (pos === letters.length){
            $('.slots', stage).classList.add('done');
            later(() => { hit(word, $('.slots', stage)); done(1700); }, 450);
          } else say(`Now find <b class="word">${esc(letters[pos])}</b>`);
        } else miss(word, t);
      });
      later(() => speak(sayable(word)), 450);
    },
  },

  missing: {
    title: 'Missing Letter', hint: 'Which letter is missing?',
    round(stage, word){
      const idx = Math.floor(Math.random() * word.length);
      const ans = word[idx];
      const opts = shuffle([ans, ...randomLetters(2, [ans])]);
      stage.innerHTML = `
        <div class="prompt">${hearBtn(word)}<span>Which letter is missing?</span></div>
        <div class="mword word">${word.split('').map((c, i) => i === idx ? `<span class="gap">${esc(c)}</span>` : `<span>${esc(c)}</span>`).join('')}</div>
        <div class="letters">${opts.map(c => `<button class="letter word" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>`;
      wireHear(stage, word);
      $$('.letter', stage).forEach(b => b.onclick = () => {
        if (session.locked) return;
        if (lc(b.dataset.c) === lc(ans)){ $('.gap', stage).classList.add('filled'); hit(word, $('.mword', stage)); done(); }
        else { b.classList.add('dim'); miss(word, b); }
      });
      later(() => speak(sayable(word)), 450);
    },
  },

  memory: {
    title: 'Match Up', hint: 'Flip two cards to find a pair!', rounds: 3,
    round(stage, word){
      const ws = [word, ...distractors(word, 2)];
      const cards = shuffle([...ws, ...ws]);
      stage.innerHTML = `<div class="mgrid">${cards.map(w => `
        <button class="mcard" data-w="${esc(w)}" aria-label="Card"><div class="inner">
          <div class="face back">${FLOWER_MINI}</div><div class="face front word">${esc(w)}</div>
        </div></button>`).join('')}</div>`;
      let open = [], matched = 0, busy = false;
      $$('.mcard', stage).forEach(c => c.onclick = () => {
        if (busy || session.locked || c.classList.contains('flip')) return;
        c.classList.add('flip'); sfx.tap(); speak(sayable(c.dataset.w));
        open.push(c);
        if (open.length < 2) return;
        const [a, b] = open; open = [];
        if (a.dataset.w === b.dataset.w){
          later(() => {
            a.classList.add('matched'); b.classList.add('matched'); matched++;
            hit(a.dataset.w, b, { silent: matched < ws.length });
            if (matched < ws.length) say(`A pair of <b class="word">${esc(a.dataset.w)}</b>!`);
            else done(1700);
          }, 450);
        } else {
          busy = true;
          later(() => { a.classList.remove('flip'); b.classList.remove('flip'); busy = false; }, 1100);
        }
      });
    },
  },

  read: {
    title: 'Read to Me', hint: 'Read it out loud to a grown-up!',
    round(stage, word){
      stage.innerHTML = `
        <div class="readcard word">${word.split('').map(c => `<span>${esc(c)}</span>`).join('')}</div>
        <div class="row">
          <button class="soft-btn" id="hearIt">${SPEAKER_INK}Hear it</button>
          <button class="soft-btn" id="spellIt">${ABC}Spell it</button>
        </div>
        <button class="go-btn" id="readIt">I read it!</button>`;
      const spans = $$('.readcard span', stage);
      $('#hearIt', stage).onclick = () => speak(sayable(word));
      $('#spellIt', stage).onclick = () => {
        const clear = () => spans.forEach(s => s.classList.remove('lit'));
        speakSeq([
          ...word.split('').map((c, i) => ({ text: lc(c), rate: .8, onstart: () => { clear(); spans[i].classList.add('lit'); } })),
          { text: sayable(word), onstart: () => spans.forEach(s => s.classList.add('lit')), onend: clear },
        ]);
      };
      $('#readIt', stage).onclick = () => { if (!session.locked){ hit(word, $('.readcard', stage)); done(); } };
    },
  },
};

/* ---------- end of round ---------- */
function finish(){
  const s = session;
  s.timers.forEach(clearTimeout);
  sfx.win(); rain();
  const grown = [...s.grown];
  const shown = Math.min(s.stars, 12);
  document.body.insertAdjacentHTML('beforeend', `
    <div class="overlay" id="finish"><div class="sheet">
      ${beeSVG()}
      <h2>Hooray!</h2>
      <p>You earned ${s.stars} ${s.stars === 1 ? 'star' : 'stars'}</p>
      <div class="starrow">${Array.from({ length: shown }, (_, i) => STAR.replace('<svg', `<svg style="animation-delay:${.15 + i * .08}s"`)).join('')}</div>
      ${grown.length ? `<h3 style="margin-top:6px">Your garden grew</h3><div class="grew">${grown.map(w => plantHTML(w, 'div')).join('')}</div>` : ''}
      <div class="btns"><button class="btn" id="toGarden">Garden</button><button class="btn primary" id="again">Play again</button></div>
    </div></div>`);
  speak(`Hooray! You earned ${s.stars} stars!`);
  const close = () => $('#finish')?.remove();
  $('#toGarden').onclick = () => { close(); renderHome(); };
  $('#again').onclick = () => { close(); startGame(s.id); };
}

/* ---------- grown-ups ---------- */
function parentGate(){
  const a = 2 + Math.floor(Math.random() * 5), b = 2 + Math.floor(Math.random() * 5), ans = a + b;
  const opts = shuffle([ans, ans + 1 + Math.floor(Math.random() * 2), ans - 1 - Math.floor(Math.random() * 2)]);
  document.body.insertAdjacentHTML('beforeend', `
    <div class="overlay" id="gate"><div class="sheet">
      <h3>Grown-ups only</h3>
      <div class="gate-q">${a} + ${b} = ?</div>
      <div class="gate-opts">${opts.map(n => `<button data-n="${n}">${n}</button>`).join('')}</div>
      <button class="link-btn" id="gateCancel">Cancel</button>
    </div></div>`);
  const gate = $('#gate');
  $$('.gate-opts button', gate).forEach(btn => btn.onclick = () => {
    if (+btn.dataset.n === ans){ gate.remove(); renderParent(); }
    else replay(btn, 'shake');
  });
  $('#gateCancel').onclick = () => gate.remove();
  gate.onclick = e => { if (e.target === gate) gate.remove(); };
}

function cleanWord(raw){ return raw.trim().replace(/[^a-zA-Z']/g, ''); }

function renderParent(){
  let draft = state.words.slice();
  app.innerHTML = `
    <header class="top"><div class="brand"><h1>For grown-ups</h1></div><button class="ibtn" id="back" aria-label="Back">${CLOSE}</button></header>
    <section class="card form">
      <label for="wordInput">Sight words</label>
      <div class="chips" id="chips"></div>
      <p class="hint">Type a word and press Enter or comma. You can paste a whole list too.</p>
    </section>
    <button class="btn coral" id="saveBtn" style="display:block;margin:18px auto 0;min-width:200px">Save words</button>
    <h2 class="sec">Progress</h2>
    <section class="card" style="padding:8px 18px" id="progress"></section>
    <button class="link-btn" id="resetBtn">Reset progress and stars</button>`;

  const chips = $('#chips');
  function drawChips(){
    chips.innerHTML = draft.map((w, i) => `<span class="chipw word">${esc(w)}<button data-i="${i}" aria-label="Remove ${esc(w)}">${CLOSE}</button></span>`).join('')
      + `<input id="wordInput" placeholder="${draft.length ? 'add a word…' : 'type a word…'}" autocomplete="off" autocapitalize="off" spellcheck="false">`;
    $$('.chipw button', chips).forEach(b => b.onclick = e => { e.stopPropagation(); draft.splice(+b.dataset.i, 1); drawChips(); $('#wordInput').focus(); });
    const input = $('#wordInput');
    input.onkeydown = e => {
      if (e.key === 'Enter' || e.key === ',' || e.key === ' '){ e.preventDefault(); addFrom(input.value); }
      else if (e.key === 'Backspace' && !input.value && draft.length){ draft.pop(); drawChips(); $('#wordInput').focus(); }
    };
    input.onpaste = e => { e.preventDefault(); addFrom((e.clipboardData || window.clipboardData).getData('text')); };
    input.onblur = () => { if (input.value.trim()) addFrom(input.value, false); };
  }
  function addFrom(text, refocus = true){
    text.split(/[\s,;]+/).map(cleanWord).filter(Boolean).forEach(w => {
      if (!draft.some(d => lc(d) === lc(w)) && draft.length < 40) draft.push(w);
    });
    drawChips();
    if (refocus) $('#wordInput').focus();
  }
  chips.onclick = () => $('#wordInput').focus();
  drawChips();

  function drawProgress(){
    const list = state.words;
    $('#progress').innerHTML = list.length ? list.map(w => {
      const s = scoreOf(w);
      return `<div class="prog"><span class="word">${esc(w)}</span><div class="bar"><b style="width:${s * 20}%"></b></div><span>${s}/5</span></div>`;
    }).join('') : `<div class="empty">No words yet.</div>`;
  }
  drawProgress();

  $('#saveBtn').onclick = () => {
    const pending = $('#wordInput').value;
    if (pending.trim()) addFrom(pending, false);
    if (!draft.length){ replay($('#chips'), 'shake'); return; }
    state.words = draft.slice(); save();
    const btn = $('#saveBtn'); btn.textContent = 'Saved'; sfx.yes();
    drawProgress();
    setTimeout(() => { if (btn.isConnected) btn.textContent = 'Save words'; }, 1400);
  };
  $('#resetBtn').onclick = () => {
    if (!confirm('Reset all word progress and stars?')) return;
    state.scores = {}; state.stars = 0; save(); drawProgress();
  };
  $('#back').onclick = renderHome;
}

renderHome();
</script>
</body>
</html>
